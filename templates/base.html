<!DOCTYPE html>
<html lang="{{ request.session.get('lang', 'fr') }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}Immo-Tion{% endblock %} — {{ t(request, 'app.name', 'Immo-Tion') }}</title>
  <link rel="stylesheet" href="/static/css/inter.css">
  <link rel="stylesheet" href="/static/css/fontawesome.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
</head>
<body>
  <div class="app-layout">
    <!-- Left Sidebar -->
    {% include 'components/sidebar.html' %}

    <!-- Mobile Backdrop Overlay -->
    <div id="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>

    <!-- Main App Container (Topbar + Content) -->
    <div class="app-main">
      {% include 'components/topbar.html' %}

      <main class="main-container">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
