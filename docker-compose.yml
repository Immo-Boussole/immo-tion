version: "3.8"

services:
  immo-tion:
    build:
      context: .
      dockerfile: Dockerfile
    image: wikijm/immo-tion:latest
    container_name: immo-tion
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - APP_PORT=8085
      - DATA_DIR=/data
      - APP_ENV=production
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
